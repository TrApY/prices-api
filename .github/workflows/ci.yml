name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/trapy/prices-api

jobs:
  secrets-check:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Detect plaintext secrets
        run: |
          pip install --quiet detect-secrets
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  build:
    name: Build
    needs: secrets-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew assemble
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/*.jar

  tests:
    name: Test (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-integration
            suite: test
            reports: build/reports/tests/test
          - name: cucumber
            suite: cucumberTest
            reports: |
              build/reports/tests/cucumberTest
              build/reports/cucumber
          - name: karate
            suite: karateTest
            reports: build/reports/tests/karateTest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run ${{ matrix.suite }}
        env:
          JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
        run: ./gradlew ${{ matrix.suite }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.name }}
          path: ${{ matrix.reports }}

  contract:
    name: Contract
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate OpenAPI contract
        run: ./gradlew openApiValidate

  dockerize:
    name: Dockerize
    needs: [tests, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Save image for the scan stage
        run: docker save "$IMAGE:${{ github.sha }}" -o image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (solo develop/main)
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  security-scan:
    name: Security scan
    needs: dockerize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      # Gate en formato tabla: si corta, los hallazgos quedan visibles en el log.
      - name: Trivy gate (CRITICAL con fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/trapy/prices-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy SARIF (informe completo)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/trapy/prices-api:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          skip-setup-trivy: true
      - name: Upload SARIF to Security tab
        # El code scanning de GitHub requiere repo público (o Advanced Security);
        # se activa solo cuando el repo se publique.
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
